<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRANSIT CAMP FC - LIVE</title>
<style>
body{margin:0;font-family:Arial;background:#081c12;color:white;text-align:center}
.header{background:#ffde59;color:#081c12;padding:15px;font-weight:900;font-size:22px}
.score-box{background:white;color:black;margin:15px;border-radius:16px;padding:20px}
.score{font-size:56px;font-weight:900}
.live{color:red;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.card{background:white;color:black;margin:10px;border-radius:12px;padding:15px;text-align:left}
.hist{background:#081c12;border:1px solid #ffde59;color:white}
.social{padding:20px} .social a{padding:12px 18px;border-radius:25px;color:white;text-decoration:none;margin:5px;display:inline-block;font-weight:bold}
</style>
</head>
<body>
<div class="header">TRANSIT CAMP FC - KIMARA</div>
<div class="score-box">
<div id="liveStatus"></div>
<div id="matchTitle">TRANSIT CAMP FC vs KMC FC</div>
<div class="score"><span id="sh">0</span> - <span id="sa">0</span></div>
<div>Dakika <span id="min">0</span>'</div>
<div>Uwanja: KMC Complex</div>
</div>
<div class="card">
<h3>⚽ MAGOLI LIVE</h3>
<div style="display:flex;gap:10px;">
<div style="flex:1;background:#e8ffe8;padding:10px;border-radius:8px;">
<b style="color:green;">🟢 TRANSIT CAMP</b>
<div id="goalsTrans" style="margin-top:8px;">Hakuna goli</div>
</div>
<div style="flex:1;background:#ffe8e8;padding:10px;border-radius:8px;">
<b style="color:red;">🔴 KMC FC</b>
<div id="goalsKmc" style="margin-top:8px;">Hakuna goli</div>
</div>
</div>
<h3 style="margin-top:15px;">🌟 MCHEZAJI BORA WA MECHI</h3>
<div id="liveMotm" style="background:#fff8c4;padding:10px;border-radius:8px;font-weight:bold;">Bado hajachaguliwa</div>
</div>
<div class="card hist">
<h3 style="color:#ffde59;">📚 HISTORIA + RATIBA INAYOFUATA</h3>
<div id="historyList">Inapakia historia...</div>
</div>
<div class="social">
<a href="https://facebook.com/" style="background:#1877F2">📘 Facebook</a>
<a href="https://instagram.com/" style="background:#E1306C">📸 Instagram</a>
<a href="https://wa.me/255700000000" style="background:#25D366">💬 WhatsApp</a>
</div>
<script>
function load(){
 let d=JSON.parse(localStorage.getItem('trans_live')||'{"team1":"TRANSIT CAMP FC","team2":"KMC FC","sh":0,"sa":0,"min":0,"match":"TRANSIT CAMP FC vs KMC FC","live":false,"goals":[],"motm":""}');
 document.getElementById('matchTitle').innerText=d.match;
 document.getElementById('sh').innerText=d.sh;
 document.getElementById('sa').innerText=d.sa;
 document.getElementById('min').innerText=d.min;
 document.getElementById('liveStatus').innerHTML=d.live?'<span class=live>🔴 LIVE KMC COMPLEX</span>':'⚪ Bado Haijaanza';
 if(d.goals&&d.goals.length>0){
  let trans = d.goals.filter(g=>g.team.includes('TRANS'));
  let kmc = d.goals.filter(g=>!g.team.includes('TRANS'));
  document.getElementById('goalsTrans').innerHTML = trans.length>0 ? trans.map(g=>`⚽ <b>${g.player}</b> - Dk ${g.min}'`).join('<br>') : 'Hakuna goli';
  document.getElementById('goalsKmc').innerHTML = kmc.length>0 ? kmc.map(g=>`⚽ <b>${g.player}</b> - Dk ${g.min}'`).join('<br>') : 'Hakuna goli';
 }
 if(d.motm){document.getElementById('liveMotm').innerText=d.motm;}
 let hist=JSON.parse(localStorage.getItem('trans_history')||'[]');
 let next=JSON.parse(localStorage.getItem('trans_next')||'{}');
 let html='';
 if(hist.length>0){html+=hist.slice().reverse().map(h=>`<div style="border-bottom:1px solid #333;padding:8px 0;"><b>${h.match}</b> ${h.score}<br><small>${(h.goals||[]).map(g=>g.player+' '+g.min+"'").join(', ')} | MOTM: ${h.motm}</small></div>`).join('');}
 else{html+='Mechi ya kwanza: Kesho vs KMC Complex<br>';}
 if(next.opp){html+=`<div style="margin-top:12px;background:#ffde59;color:black;padding:10px;border-radius:8px;"><b>INAYOFUATA:</b> vs ${next.opp} - ${next.date} - ${next.venue}</div>`;}
 document.getElementById('historyList').innerHTML=html;
}
setInterval(load,3000);load();
</script>
</body>
</html>
