<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Transit Camp FC</title>
<style>
body{font-family:Arial;padding:12px;background:#0a2210;color:white}
.card{background:white;color:black;padding:16px;border-radius:14px;margin-bottom:12px}
h3{color:#0a4a25;margin-bottom:8px}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
button{width:100%;padding:12px;background:#0a4a25;color:white;border:none;border-radius:10px;font-weight:900;margin-top:8px;font-size:14px}
.btn-yellow{background:#ffde59;color:#0a2210}
.btn-red{background:#ff4444}
.small{font-size:12px;color:#666;margin-bottom:6px}
</style>
</head>
<body>
<div class="card">
<h3>⚽ LIVE SCORE</h3>
<input id="sh" type="number" placeholder="Transit Goals">
<input id="sa" type="number" placeholder="Opponent Goals">
<input id="min" type="text" placeholder="Minute mf 45'">
<input id="motm" type="text" placeholder="MOTM mf Juma K.">
<button onclick="saveLive()">HIFADHI LIVE</button>
<button class="btn-yellow" onclick="clearLive()">Futa Live</button>
</div>
<div class="card">
<h3>✅ WEKA MATOKEO YA MWISHO</h3>
<input id="resDate" type="date" value="2026-10-17">
<input id="resMatch" type="text" value="Transit Camp FC vs KMC FC">
<input id="resScore" type="text" placeholder="2-0">
<input id="resScorers" type="text" placeholder="Juma 23', Pato 78'">
<button onclick="saveResult()">HIFADHI MATOKEO</button>
</div>
<div class="card">
<h3>📋 MATOKEO</h3>
<div id="list"></div>
<button class="btn-red" onclick="clearResults()">Futa Matokeo Yote</button>
</div>
<div class="card" style="text-align:center"><a href="index.html" style="color:#0a4a25;font-weight:900;text-decoration:none">⬅️ RUDI INDEX</a></div>
<script>
function saveLive(){
 let d={sh:document.getElementById('sh').value,sa:document.getElementById('sa').value,min:document.getElementById('min').value,motm:document.getElementById('motm').value};
 localStorage.setItem('trans_live',JSON.stringify(d));
 alert('LIVE saved!');
}
function clearLive(){localStorage.removeItem('trans_live');alert('LIVE cleared');}
function saveResult(){
 let results=JSON.parse(localStorage.getItem('trans_results')||'[]');
 results.push({date:document.getElementById('resDate').value,match:document.getElementById('resMatch').value,score:document.getElementById('resScore').value,scorers:document.getElementById('resScorers').value});
 localStorage.setItem('trans_results',JSON.stringify(results));
 alert('Matokeo saved!');renderList();localStorage.removeItem('trans_live');
}
function renderList(){
 let results=JSON.parse(localStorage.getItem('trans_results')||'[]');
 if(results.length==0){document.getElementById('list').innerHTML="<small>Hakuna bado</small>";return;}
 document.getElementById('list').innerHTML=results.map((r,i)=>`<div style="border-bottom:1px solid #eee;padding:8px 0;font-size:13px"><b>${r.date}</b> - ${r.match} <b style="color:#0a4a25">${r.score}</b><br><small>${r.scorers}</small><br><button onclick="delOne(${i})" style="background:red;padding:4px 10px;width:auto;margin-top:4px;font-size:11px">Futa</button></div>`).join('');
}
function delOne(i){let r=JSON.parse(localStorage.getItem('trans_results')||'[]');r.splice(i,1);localStorage.setItem('trans_results',JSON.stringify(r));renderList();}
function clearResults(){if(confirm('Futa yote?')){localStorage.removeItem('trans_results');renderList();}}
renderList();
</script>
</body>
</html>
